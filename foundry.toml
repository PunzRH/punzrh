[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
